<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Classes</title>
  <style>
    a:link {
      color: hotpink;

    }
    a:visited {
      color: tomato;
    }
    a:hover {
      background: palegoldenrod;
      transition: background 1s;
    }
    p:not(.animationland){
      color: lightsalmon;
    }
    div:nth-child(1) {
      color: lightseagreen;
    }
  </style>
</head>
<body>
  <a href="/">Alice</a>
  <p>in the</p>
  <p class="animationland">country</p>
  <div class="container">
    <div>Alice</div>
    <div>Alice</div>          
    <div>Alice</div>          
  </div>
</body>
</html>
