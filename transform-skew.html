<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transform Skew</title>
  <style>
    div {
      background: lightpink;
      border-radius: 10px;
      width: 100px;
      height: 100px;
    }
    div:hover {
      /* transform: skewX(20deg); */
      /* transform: skewY(20deg); */
      transform: skew(20deg);
      transition: transform 1s ease;
    }
  </style>
</head>
<body>
  <div></div>
</body>
</html>
