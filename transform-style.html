<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transform Style, Perspective and Style Origin</title>
  <style>
    .container {
      position: relative;
      width: 100px;
      height: 100px;
      border: solid 5px hotpink;
      border-radius: 10px;
      perspective: 100px;
    }
    .item {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: papayawhip;
      border: 3px solid hotpink;
      border-radius: 10px;
      opacity: 0.8;
      transform-style: preserve-3d;
      transform: rotateX(50deg);
    }  
  </style>
</head>
<body>
  <div class="container">
    <div class="item"></div>
  </div>
</body>
</html>
